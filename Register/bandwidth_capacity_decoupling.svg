<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="hbm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E44AD"/>
      <stop offset="100%" stop-color="#6C3483"/>
    </linearGradient>
    <linearGradient id="buf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27AE60"/>
      <stop offset="100%" stop-color="#1E8449"/>
    </linearGradient>
    <linearGradient id="reg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">寄存器层级的带宽-数量解耦</text>
  <text x="400" y="55" text-anchor="middle" font-size="14" fill="#666">从 GPU 的"寄存器民主"到 CPU/NPU 的"寄存器精英 + Buffer 民主"</text>

  <!-- ====== LEFT: GPU Register File Dominance ====== -->
  <text x="200" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#C0392B">GPU：寄存器即一切</text>

  <!-- Top: large register file -->
  <rect x="100" y="100" width="200" height="50" rx="6" fill="#E74C3C" opacity="0.85"/>
  <text x="200" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="white">寄存器文件（64K Regs）</text>
  <text x="200" y="142" text-anchor="middle" font-size="10" fill="#E74C3C" opacity="0.7">高带宽 × 大容量</text>

  <!-- Show register file serves both axes -->
  <line x1="200" y1="155" x2="200" y2="175" stroke="#555" stroke-width="1.5"/>
  <!-- Left branch: bandwidth -->
  <line x1="200" y1="175" x2="120" y2="210" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="130" y="200" text-anchor="middle" font-size="11" fill="#C0392B" font-weight="bold">带宽</text>
  <text x="80" y="230" text-anchor="middle" font-size="10" fill="#555">多 bank 多端口</text>
  <text x="80" y="245" text-anchor="middle" font-size="10" fill="#555">供给计算 pipe</text>
  <rect x="50" y="258" width="60" height="20" rx="3" fill="#E74C3C" opacity="0.3" stroke="#E74C3C" stroke-width="1"/>
  <text x="80" y="272" text-anchor="middle" font-size="9" fill="#C0392B">算子利用率</text>

  <!-- Right branch: capacity -->
  <line x1="200" y1="175" x2="280" y2="210" stroke="#8E44AD" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="200" text-anchor="middle" font-size="11" fill="#6C3483" font-weight="bold">容量</text>
  <text x="320" y="230" text-anchor="middle" font-size="10" fill="#555">支撑大量在途线程</text>
  <text x="320" y="245" text-anchor="middle" font-size="10" fill="#555">隐藏访存延迟</text>
  <rect x="290" y="258" width="60" height="20" rx="3" fill="#8E44AD" opacity="0.3" stroke="#8E44AD" stroke-width="1"/>
  <text x="320" y="272" text-anchor="middle" font-size="9" fill="#6C3483">线程并行度</text>

  <!-- Problem annotation -->
  <rect x="60" y="295" width="280" height="38" rx="5" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1"/>
  <text x="200" y="312" text-anchor="middle" font-size="10" fill="#E65100">⚠ 矛盾：带宽需求推高端口数 → 面积/功耗爆炸</text>
  <text x="200" y="326" text-anchor="middle" font-size="10" fill="#E65100">  容量需求推高寄存器总量 → 寄存器文件面积占 SM 60%+</text>

  <!-- ====== RIGHT: CPU/NPU Decoupled ====== -->
  <text x="600" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E8449">CPU/NPU：解耦方案（Buffer + 寄存器）</text>

  <!-- Top: small register file -->
  <rect x="480" y="100" width="100" height="42" rx="6" fill="#E74C3C" opacity="0.7"/>
  <text x="530" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="white">寄存器文件</text>
  <text x="530" y="135" text-anchor="middle" font-size="9" fill="white">高带宽 × 小容量</text>

  <!-- Middle: Buffer -->
  <rect x="590" y="100" width="120" height="42" rx="6" fill="#27AE60" opacity="0.7"/>
  <text x="650" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="white">核内 Buffer</text>
  <text x="650" y="135" text-anchor="middle" font-size="9" fill="white">大容量 × 低带宽</text>

  <!-- Shared Memory label -->
  <text x="530" y="160" text-anchor="middle" font-size="9" fill="#888">(32-256 KB / SM)</text>
  <text x="650" y="160" text-anchor="middle" font-size="9" fill="#888">(64-256 KB / SM)</text>

  <!-- Register serves bandwidth -->
  <line x1="530" y1="148" x2="530" y2="195" stroke="#E74C3C" stroke-width="2"/>
  <line x1="530" y1="195" x2="470" y2="230" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="455" y="225" text-anchor="end" font-size="11" fill="#C0392B" font-weight="bold">带宽</text>
  <text x="450" y="250" text-anchor="end" font-size="10" fill="#555">多指令并行读写</text>
  <text x="450" y="265" text-anchor="end" font-size="10" fill="#555">FMA+CVT+EXP+INT同发</text>
  <rect x="430" y="275" width="75" height="20" rx="3" fill="#E74C3C" opacity="0.3" stroke="#E74C3C" stroke-width="1"/>
  <text x="467" y="289" text-anchor="middle" font-size="9" fill="#C0392B">IPC 榨取</text>

  <!-- Buffer serves capacity -->
  <line x1="650" y1="148" x2="650" y2="195" stroke="#27AE60" stroke-width="2"/>
  <line x1="650" y1="195" x2="710" y2="230" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="730" y="225" text-anchor="start" font-size="11" fill="#1E8449" font-weight="bold">容量</text>
  <text x="735" y="250" text-anchor="start" font-size="10" fill="#555">launch 长时延访存</text>
  <text x="735" y="265" text-anchor="start" font-size="10" fill="#555">暂存预取数据</text>
  <rect x="730" y="275" width="75" height="20" rx="3" fill="#27AE60" opacity="0.3" stroke="#27AE60" stroke-width="1"/>
  <text x="767" y="289" text-anchor="middle" font-size="9" fill="#1E8449">在途操作数</text>

  <!-- Connection between buffer and register -->
  <path d="M590,121 L580,121" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="565" y="118" text-anchor="middle" font-size="9" fill="#888">数据搬运</text>

  <!-- Bottom summary row -->
  <rect x="55" y="320" width="690" height="80" rx="8" fill="#F5F5F5" stroke="#999" stroke-width="1"/>

  <text x="400" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">解耦后的架构收益</text>

  <!-- Three benefits -->
  <circle cx="120" cy="370" r="6" fill="#E74C3C"/>
  <text x="135" y="374" font-size="11" fill="#333">寄存器回归"计算加速"本职，只做高带宽单周期读写</text>

  <circle cx="120" cy="388" r="6" fill="#27AE60"/>
  <text x="135" y="392" font-size="11" fill="#333">Buffer 用 SRAM 实现大容量，面积/功耗远低于同容量的多端口寄存器</text>

  <!-- Warp specialization -->
  <rect x="100" y="405" width="600" height="30" rx="5" fill="#E8F5E9" stroke="#27AE60" stroke-width="1"/>
  <text x="400" y="425" text-anchor="middle" font-size="11" fill="#1E8449">Warp Specialization: 访存专家（TMA）→ Buffer → 计算专家（Tensor/Vector Core）→ 寄存器 → 乱序多发射</text>

</svg>
