<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
    <linearGradient id="gpu-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#357ABD"/>
    </linearGradient>
    <linearGradient id="cpu-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#D35400"/>
    </linearGradient>
    <linearGradient id="buf-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27AE60"/>
      <stop offset="100%" stop-color="#1E8449"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">两种寄存器使用哲学：GPU vs CPU/NPU 架构对比</text>

  <!-- ====== LEFT: GPU Mode ====== -->
  <text x="225" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A90D9">GPU 模式（SIMT / 延迟隐藏）</text>

  <!-- Large register file -->
  <rect x="60" y="85" width="330" height="130" rx="8" fill="url(#gpu-grad)" opacity="0.15" stroke="#4A90D9" stroke-width="2"/>
  <text x="225" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A90D9">海量寄存器文件（64K × 32-bit / SM）</text>

  <!-- Show many small register slots -->
  <rect x="75" y="125" width="28" height="18" rx="2" fill="#4A90D9" opacity="0.6"/>
  <rect x="108" y="125" width="28" height="18" rx="2" fill="#4A90D9" opacity="0.4"/>
  <rect x="141" y="125" width="28" height="18" rx="2" fill="#4A90D9" opacity="0.6"/>
  <rect x="174" y="125" width="28" height="18" rx="2" fill="#4A90D9" opacity="0.4"/>
  <rect x="207" y="125" width="28" height="18" rx="2" fill="#4A90D9" opacity="0.6"/>
  <rect x="240" y="125" width="28" height="18" rx="2" fill="#4A90D9" opacity="0.4"/>
  <rect x="273" y="125" width="28" height="18" rx="2" fill="#4A90D9" opacity="0.6"/>
  <rect x="306" y="125" width="28" height="18" rx="2" fill="#4A90D9" opacity="0.4"/>
  <rect x="75" y="148" width="28" height="18" rx="2" fill="#4A90D9" opacity="0.5"/>
  <rect x="108" y="148" width="28" height="18" rx="2" fill="#4A90D9" opacity="0.3"/>
  <rect x="141" y="148" width="28" height="18" rx="2" fill="#4A90D9" opacity="0.5"/>
  <rect x="174" y="148" width="28" height="18" rx="2" fill="#4A90D9" opacity="0.3"/>
  <rect x="207" y="148" width="28" height="18" rx="2" fill="#4A90D9" opacity="0.5"/>
  <rect x="240" y="148" width="28" height="18" rx="2" fill="#4A90D9" opacity="0.3"/>
  <rect x="273" y="148" width="28" height="18" rx="2" fill="#4A90D9" opacity="0.5"/>
  <rect x="306" y="148" width="28" height="18" rx="2" fill="#4A90D9" opacity="0.3"/>
  <text x="350" y="155" font-size="10" fill="#666">... 更多</text>

  <!-- Bandwidth annotation -->
  <text x="225" y="190" text-anchor="middle" font-size="11" fill="#888">← 每个线程私有寄存器 →</text>
  <text x="225" y="205" text-anchor="middle" font-size="11" fill="#888">← 多端口 / 多 bank 高带宽 →</text>

  <!-- Warp scheduler arrow down -->
  <line x1="100" y1="220" x2="100" y2="260" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="225" y1="220" x2="225" y2="260" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="220" x2="350" y2="260" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225" y="245" text-anchor="middle" font-size="12" fill="#666" font-style="italic">Warp Scheduler（零开销切换）</text>

  <!-- Multiple warps / threads -->
  <text x="100" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#E74C3C">Warp 0</text>
  <text x="225" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#E74C3C">Warp 1</text>
  <text x="350" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#E74C3C">Warp N</text>

  <rect x="75" y="288" width="50" height="16" rx="3" fill="#E74C3C" opacity="0.2"/>
  <rect x="200" y="288" width="50" height="16" rx="3" fill="#E74C3C" opacity="0.2"/>
  <rect x="325" y="288" width="50" height="16" rx="3" fill="#E74C3C" opacity="0.2"/>

  <!-- Execution pipes -->
  <line x1="100" y1="308" x2="100" y2="360" stroke="#555" stroke-width="2"/>
  <line x1="225" y1="308" x2="225" y2="360" stroke="#555" stroke-width="2"/>
  <line x1="350" y1="308" x2="350" y2="360" stroke="#555" stroke-width="2"/>

  <!-- ALU pipes -->
  <rect x="60" y="365" width="60" height="30" rx="4" fill="#4A90D9" opacity="0.8"/>
  <text x="90" y="384" text-anchor="middle" font-size="11" fill="white" font-weight="bold">INT</text>
  <rect x="125" y="365" width="60" height="30" rx="4" fill="#4A90D9" opacity="0.8"/>
  <text x="155" y="384" text-anchor="middle" font-size="11" fill="white" font-weight="bold">FP32</text>
  <rect x="190" y="365" width="60" height="30" rx="4" fill="#4A90D9" opacity="0.8"/>
  <text x="220" y="384" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Tensor</text>
  <rect x="255" y="365" width="60" height="30" rx="4" fill="#4A90D9" opacity="0.8"/>
  <text x="285" y="384" text-anchor="middle" font-size="11" fill="white" font-weight="bold">SFU</text>
  <rect x="320" y="365" width="60" height="30" rx="4" fill="#4A90D9" opacity="0.8"/>
  <text x="350" y="384" text-anchor="middle" font-size="11" fill="white" font-weight="bold">LD/ST</text>

  <!-- Key insight box -->
  <rect x="60" y="410" width="330" height="55" rx="6" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1.5"/>
  <text x="225" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">核心思想：大量寄存器支撑大量在途线程</text>
  <text x="225" y="448" text-anchor="middle" font-size="11" fill="#555">每个长时延指令消耗一个寄存器 → 需要海量寄存器隐藏访存延迟</text>
  <text x="225" y="462" text-anchor="middle" font-size="11" fill="#555">带宽靠多 bank 多端口解决，数量靠寄存器总量解决</text>

  <!-- ====== RIGHT: CPU/NPU Mode ====== -->
  <text x="675" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#E67E22">CPU/NPU 模式（乱序 + 缓冲）</text>

  <!-- Small register file -->
  <rect x="510" y="85" width="330" height="85" rx="8" fill="url(#cpu-grad)" opacity="0.15" stroke="#E67E22" stroke-width="2"/>
  <text x="675" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#E67E22">紧凑寄存器 / 向量寄存器文件</text>

  <!-- Few register slots -->
  <rect x="520" y="125" width="40" height="20" rx="3" fill="#E67E22" opacity="0.7"/>
  <rect x="575" y="125" width="40" height="20" rx="3" fill="#E67E22" opacity="0.5"/>
  <rect x="630" y="125" width="40" height="20" rx="3" fill="#E67E22" opacity="0.7"/>
  <rect x="685" y="125" width="40" height="20" rx="3" fill="#E67E22" opacity="0.5"/>
  <rect x="740" y="125" width="40" height="20" rx="3" fill="#E67E22" opacity="0.7"/>
  <text x="675" y="160" text-anchor="middle" font-size="11" fill="#888">数量少但高带宽（多读/写端口）</text>

  <!-- On-chip buffer -->
  <rect x="510" y="180" width="330" height="75" rx="8" fill="url(#buf-grad)" opacity="0.15" stroke="#27AE60" stroke-width="2"/>
  <text x="675" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#27AE60">核内 Buffer / 暂存存储器</text>
  <text x="675" y="218" text-anchor="middle" font-size="11" fill="#555">大容量，低带宽需求</text>
  <text x="675" y="233" text-anchor="middle" font-size="11" fill="#555">← 预取数据、解耦访存与计算 →</text>
  <text x="675" y="248" text-anchor="middle" font-size="11" fill="#555">← 多专家（MoE）间数据交互 →</text>

  <!-- Arrow from buffer to register -->
  <path d="M675,258 L675,270" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <text x="685" y="268" font-size="10" fill="#27AE60">数据搬运</text>

  <!-- OoO + multi-issue area -->
  <rect x="510" y="280" width="330" height="50" rx="6" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="675" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#7B1FA2">重排序缓冲区 + 乱序多发射</text>
  <text x="675" y="318" text-anchor="middle" font-size="11" fill="#555">← FMA、CVT、EXP、INT ALU 同时上 pipe →</text>

  <!-- Execution pipes -->
  <rect x="520" y="340" width="55" height="28" rx="4" fill="#E67E22" opacity="0.8"/>
  <text x="547" y="358" text-anchor="middle" font-size="10" fill="white" font-weight="bold">FMA</text>
  <rect x="580" y="340" width="55" height="28" rx="4" fill="#E67E22" opacity="0.8"/>
  <text x="607" y="358" text-anchor="middle" font-size="10" fill="white" font-weight="bold">CVT</text>
  <rect x="640" y="340" width="55" height="28" rx="4" fill="#E67E22" opacity="0.8"/>
  <text x="667" y="358" text-anchor="middle" font-size="10" fill="white" font-weight="bold">EXP</text>
  <rect x="700" y="340" width="55" height="28" rx="4" fill="#E67E22" opacity="0.8"/>
  <text x="727" y="358" text-anchor="middle" font-size="10" fill="white" font-weight="bold">INT</text>
  <rect x="760" y="340" width="55" height="28" rx="4" fill="#E67E22" opacity="0.8"/>
  <text x="787" y="358" text-anchor="middle" font-size="10" fill="white" font-weight="bold">LD</text>

  <!-- Key insight box -->
  <rect x="510" y="380" width="330" height="85" rx="6" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1.5"/>
  <text x="675" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">核心思想：Buffer 解耦容量与带宽</text>
  <text x="675" y="418" text-anchor="middle" font-size="11" fill="#555">Buffer（大容量）→ 暂存预取数据、launch 长时延操作</text>
  <text x="675" y="436" text-anchor="middle" font-size="11" fill="#555">寄存器（高带宽）→ 多指令并行读写，榨取 IPC</text>
  <text x="675" y="454" text-anchor="middle" font-size="11" fill="#555">Warp Specialization：访存专家 ↔ Buffer ↔ 计算专家</text>

  <!-- Bottom axis -->
  <line x1="80" y1="500" x2="820" y2="500" stroke="#999" stroke-width="1"/>
  <text x="450" y="530" text-anchor="middle" font-size="16" font-weight="bold" fill="#555">寄存器的两个属性</text>
  <text x="450" y="555" text-anchor="middle" font-size="13" fill="#666">带宽：确定时延下的更高算子利用率 → 少而快的寄存器</text>
  <text x="450" y="575" text-anchor="middle" font-size="13" fill="#666">数量：不定长时延下最多可并发的线程数量 → 大容量 Buffer</text>
</svg>
